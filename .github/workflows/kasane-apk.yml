name: Kasane APK

# Every push to the Kasane branches builds a fast APK (no R8) signed with the shared key and attaches it to the
# "kasane-latest" release, so the download link never changes. Run it by hand with "release" ticked for the full
# minified build and the core tests.
on:
  push:
    branches: [clean/kasane, claude/awesome-planck-qerygs]
    paths: ["kasane-android/**", ".github/workflows/kasane-apk.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Full minified release build, with the core tests"
        type: boolean
        default: false

concurrency:
  group: kasane-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kasane-android
    env:
      FULL: ${{ inputs.release == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          # Branch builds read the cache but never wrote it, so every run started cold.
          cache-read-only: false
      # The Lume core libraries are committed in app/src/main/jniLibs, so no NDK is needed here.
      - name: Core tests (full builds only)
        if: env.FULL == 'true'
        run: gradle -PcoreOnly :core:test
      - name: Build and sign with the shared release key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          export KASANE_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KASANE_KEYSTORE"
          export KASANE_KEYSTORE_PASSWORD="$SIGNING_KEYSTORE_PASSWORD"
          echo "::add-mask::$KASANE_KEYSTORE_PASSWORD"
          if [ "$FULL" = "true" ]; then echo "VARIANT=release" >> "$GITHUB_ENV"; gradle :app:assembleRelease
          else echo "VARIANT=personal" >> "$GITHUB_ENV"; gradle :app:assemblePersonal; fi
      - name: Check the signature is the shared key
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          APK="$(ls app/build/outputs/apk/$VARIANT/*.apk | head -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
          grep -qi 'a906ada6970a00355b816a72057c3bc7563b041ab9d5c2f93c1ca5fbc744ed66' cert.txt
          VERSION="$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)"
          mkdir -p out && cp "$APK" "out/Kasane-$VERSION-$VARIANT.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Kasane-signed
          path: kasane-android/out/*.apk
      - name: Publish to the kasane-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view kasane-latest >/dev/null 2>&1 || gh release create kasane-latest --prerelease \
            --title "Kasane latest build" --notes "Newest signed build. The file name says the version and the build kind."
          gh release upload kasane-latest out/*.apk --clobber
